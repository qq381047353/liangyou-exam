# Render Blueprint 部署配置
# 在 Render 控制台选择 "New" → "Blueprint" → 连接本仓库，即可一键部署
# 部署后 Render 自动分配 HTTPS 域名，并注入 $PORT 环境变量
services:
  - type: web
    name: liangyou-exam-sync
    runtime: python
    plan: free
    region: singapore        # 离中国近、免费层可用；可改 oregon / frankfurt
    branch: main
    buildCommand: "true"     # 零依赖，无需构建
    startCommand: "python3 server.py"
    healthCheckPath: "/"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: PORT
        sync: false          # 由 Render 平台自动注入
